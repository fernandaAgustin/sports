<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SportSchool</title>
<meta name="theme-color" content="#16171b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preload" as="image" href="./icons/icon-512.png">
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<style>
  /* Pantalla de arranque estática: se ve al instante, antes de que cargue React */
  body{margin:0}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(160deg,#e5412d,#ff7a3d);color:#fff;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
  #boot img{width:96px;height:96px;border-radius:26px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
  #boot b{font-size:3.2rem;font-weight:700;line-height:1}
  #boot span{font-family:system-ui,sans-serif;opacity:.9}
</style>
</head>
<body>
<div id="root">
  <div id="boot"><img src="./icons/icon-512.png" alt="SportSchool" width="96" height="96"><b>SportSchool</b><span>Seguimiento deportivo escolar</span></div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
